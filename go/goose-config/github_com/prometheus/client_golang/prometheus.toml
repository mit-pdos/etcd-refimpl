# Types and names only: function and method bodies are axiomatized (the metrics mvcc's
# transactions and key index update: Counter, Gauge).
translate = ["!*", "NewCounter", "NewGauge", "NewHistogram",
  "NewCounterVec", "NewGaugeVec", "NewHistogramVec", "NewGaugeFunc", "ExponentialBuckets", "Register", "MustRegister",
  "CounterVec.WithLabelValues", "GaugeVec.With", "GaugeVec.WithLabelValues",
  "HistogramVec.WithLabelValues",
  "counter.Inc", "counter.Add", "gauge.Set", "gauge.Inc", "gauge.Dec", "gauge.Add",
  "histogram.Observe", "init.0"]
# `time` for `Opts`'s field `now func() time.Time`, so that `Opts` (`CounterOpts`) translates (a
# composite literal of it can be stepped: etcd-refimpl's reference implementation).
imports = ["!*", "time"]

# translate the definitions of all type declarations goose supports
translate_types = true
