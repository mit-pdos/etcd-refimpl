# Types and names only: function and method bodies are axiomatized (the apply package's
# ClusterVersionSet calls MustParse, Version.LessThan and Version.String).
translate = ["!*",
  # etcd-refimpl: the reference implementation's init()s
  "init.0", "init.1"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
